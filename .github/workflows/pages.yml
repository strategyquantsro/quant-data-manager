name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "SqCOT/docs/**"
      - "SqCOT/Examples/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/SqCOT
          cp -r SqCOT/docs _site/SqCOT/docs
          cp -r SqCOT/Examples _site/SqCOT/Examples
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=SqCOT/docs/">
            <link rel="canonical" href="SqCOT/docs/">
            <title>Quant Data Manager modules</title>
          </head>
          <body>
            <p>Redirecting to the <a href="SqCOT/docs/">SqCOT documentation</a>…</p>
          </body>
          </html>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
